name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ".[dev]"
      - run: python -m pytest tests -q
      - run: ruff check app tests
      - run: pyright app tests

  panel:
    name: Staff panel (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panel/staff-shell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run test
      - run: npm run build

  customer-flutter:
    name: Customer app (Flutter 3.41.8)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cliente_mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.8"
      - run: flutter pub get
      - run: flutter test
      - run: flutter analyze
      - run: flutter build apk --release --dart-define=API_BASE_URL=https://api.example.com/api/v1
