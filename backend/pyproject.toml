[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roomforge-backend"
version = "0.1.0"
description = "RoomForge staff identity API"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13",
  "argon2-cffi>=23.1",
  "boto3>=1.34",
  "cryptography>=42.0",
  "eth-account>=0.13.7,<1.0",
  "eth-utils>=5.0",
  "fastapi>=0.110",
  "httpx>=0.27",
  "PyJWT>=2.8",
  "Pillow>=10.3",
  "pillow-heif>=1.1.0",
  "psycopg[binary]>=3.1",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = [
  "eth-abi>=5.0",
  "httpx>=0.27",
  "httpx2>=1.0",
  "pyright>=1.1",
  "pytest>=8.0",
  "pytest-timeout>=2.3",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["app", "app.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 110
target-version = "py311"
cache-dir = "app/.ruff_cache"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pyright]
include = ["app", "tests"]
typeCheckingMode = "basic"
pythonVersion = "3.11"
venvPath = ".."
venv = ".venv"
reportMissingImports = "error"
