name: roomforge-local-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-roomforge_local}
      POSTGRES_USER: ${POSTGRES_USER:-roomforge_local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-postgres-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  floci:
    image: floci/floci:2.1.0-compat
    environment:
      FLOCI_STORAGE_MODE: ${FLOCI_STORAGE_MODE:-persistent}
      FLOCI_STORAGE_PERSISTENT_PATH: ${FLOCI_STORAGE_PERSISTENT_PATH:-/app/data}
      FLOCI_ENDPOINT_URL: ${FLOCI_ENDPOINT_URL:-http://127.0.0.1:4566}
      AWS_ACCESS_KEY_ID: local-test-key
      AWS_SECRET_ACCESS_KEY: local-test-secret
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-roomforge-local-assets}
      SQS_QUEUE_NAME: ${SQS_QUEUE_NAME:-roomforge-local-events}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://floci:4566}
      SQS_ENDPOINT_URL: ${SQS_ENDPOINT_URL:-http://floci:4566}
    ports:
      - "127.0.0.1:${FLOCI_PORT:-4566}:4566"
    volumes:
      - floci_data:${FLOCI_STORAGE_PERSISTENT_PATH:-/app/data}
    healthcheck:
      test:
        [
          "CMD",
          "aws",
          "--endpoint-url",
          "${FLOCI_ENDPOINT_URL:-http://127.0.0.1:4566}",
          "s3api",
          "list-buckets",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-roomforge_local}:${POSTGRES_PASSWORD:-local-postgres-only}@postgres:5432/${POSTGRES_DB:-roomforge_local}
      DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-5}
      DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-5}
      DATABASE_STATEMENT_TIMEOUT_SECONDS: ${DATABASE_STATEMENT_TIMEOUT_SECONDS:-10}
      STAFF_EMAIL_SEND_TIMEOUT_SECONDS: ${STAFF_EMAIL_SEND_TIMEOUT_SECONDS:-10}
      JWT_SECRET: ${JWT_SECRET:-roomforge-local-only-jwt-secret-do-not-use-outside-development}
      STAFF_TOTP_ENCRYPTION_KEY: ${STAFF_TOTP_ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      STAFF_WEB_ORIGIN: "http://127.0.0.1:${PANEL_PORT:-5173}"
      STAFF_SECURE_COOKIES: "false"
      STAFF_EMAIL_SENDER_FACTORY: app.core.dev_email:create_dev_outbox_sender
      ROOMFORGE_RATE_REFRESH_SECONDS: ${ROOMFORGE_RATE_REFRESH_SECONDS:-21600}
      AWS_ACCESS_KEY_ID: local-test-key
      AWS_SECRET_ACCESS_KEY: local-test-secret
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-roomforge-local-assets}
      SQS_QUEUE_NAME: ${SQS_QUEUE_NAME:-roomforge-local-events}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://floci:4566}
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://127.0.0.1:4566}
      SQS_ENDPOINT_URL: ${SQS_ENDPOINT_URL:-http://floci:4566}
      ROOMFORGE_ESCROW_RPC_URL: ${ROOMFORGE_ESCROW_RPC_URL:-http://127.0.0.1:8545}
      ROOMFORGE_ESCROW_ADDRESS: ${ROOMFORGE_ESCROW_ADDRESS:-0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0}
      ROOMFORGE_ESCROW_BOB_ADDRESS: ${ROOMFORGE_ESCROW_BOB_ADDRESS:-0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0}
      ROOMFORGE_ESCROW_USD_ADDRESS: ${ROOMFORGE_ESCROW_USD_ADDRESS:-0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0}
      ROOMFORGE_ESCROW_USDT_ADDRESS: ${ROOMFORGE_ESCROW_USDT_ADDRESS:-0xCf7Ed3AccA5a467e9e704C703E8D87F634fB0Fc9}
      ROOMFORGE_ESCROW_CHAIN_ID: ${ROOMFORGE_ESCROW_CHAIN_ID:-31337}
      # Public deterministic Hardhat development key only; never use on a public chain.
      ROOMFORGE_ESCROW_SIGNER_PRIVATE_KEY: ${ROOMFORGE_ESCROW_SIGNER_PRIVATE_KEY:-0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
      ROOMFORGE_ALLOW_LOCAL_DEMO_SEED: ${ROOMFORGE_ALLOW_LOCAL_DEMO_SEED:-false}
    ports:
      # The bind address is configurable so a phone on the same LAN can reach the API for
      # device verification; the default stays loopback-only.
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
      - "${HARDHAT_BIND_ADDRESS:-127.0.0.1}:${HARDHAT_PORT:-8545}:8545"
    depends_on:
      postgres:
        condition: service_healthy
      floci:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=35).close()",
        ]
      interval: 10s
      timeout: 40s
      retries: 5
      start_period: 30s

  hardhat:
    build:
      context: ../../contracts
      dockerfile: Dockerfile.local
    network_mode: service:api
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8545',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:'eth_chainId',params:[]})}).then(r=>r.json()).then(v=>process.exit(v.result==='0x7a69'?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  panel:
    build:
      context: ../../panel/staff-shell
      dockerfile: Dockerfile
    environment:
      VITE_API_TARGET: http://api:8000
    ports:
      - "127.0.0.1:${PANEL_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173/').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  floci_data:
