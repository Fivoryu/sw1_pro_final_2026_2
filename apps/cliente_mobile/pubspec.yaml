name: cliente_mobile
description: Minimal RoomForge client application shell.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  flutter_secure_storage: ^10.3.1
  flutter_inappwebview: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/viewer/index.html
    - assets/viewer/viewer.js
    - assets/viewer/geometry.mjs
    - assets/viewer/three.module.min.js
